<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Management Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .cases-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-top: 1px solid #f0f0f0;
            color: #555;
        }

        tbody tr {
            transition: background 0.2s ease;
            cursor: pointer;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-analyzed {
            background: #cfe2ff;
            color: #084298;
        }

        .status-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .case-id {
            font-family: 'Courier New', monospace;
            color: #667eea;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .detail-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f0f0f0;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #e0e0e0;
        }

        .detail-header {
            margin-bottom: 25px;
        }

        .detail-header h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-field {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .detail-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .photo-item {
            aspect-ratio: 1;
            background: #f0f0f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Case Management Dashboard</h1>
            <p>Monitor and manage inspection cases</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-number" id="totalCases">-</div>
                <div class="stat-label">Total Cases</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingCases">-</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="analyzedCases">-</div>
                <div class="stat-label">Analyzed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedCases">-</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-status="all">All Cases</button>
            <button class="filter-btn" data-status="pending">Pending</button>
            <button class="filter-btn" data-status="analyzed">Analyzed</button>
            <button class="filter-btn" data-status="completed">Completed</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by case ID or part family...">
            </div>
        </div>

        <div class="cases-table">
            <table>
                <thead>
                    <tr>
                        <th>Case ID</th>
                        <th>Part Family</th>
                        <th>Defect Type</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Photos</th>
                    </tr>
                </thead>
                <tbody id="casesTableBody">
                    <tr>
                        <td colspan="6" class="loading">Loading cases...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="detail-modal" id="detailModal">
        <div class="detail-content">
            <button class="close-btn" onclick="closeDetail()">X</button>
            <div class="detail-header">
                <h2>Case Details</h2>
                <p id="detailCaseId"></p>
            </div>
            <div id="detailBody"></div>
        </div>
    </div>

    <script>
        let allCases = [];
        let currentFilter = 'all';

        async function loadStatistics() {
            try {
                const response = await fetch('/api/cases/statistics/summary');
                const stats = await response.json();
                
                document.getElementById('totalCases').textContent = stats.total || 0;
                document.getElementById('pendingCases').textContent = stats.pending || 0;
                document.getElementById('analyzedCases').textContent = stats.analyzed || 0;
                document.getElementById('completedCases').textContent = stats.completed || 0;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        async function loadCases(status = null) {
            try {
                const url = status && status !== 'all' 
                    ? `/api/cases?status=${status}`
                    : '/api/cases';
                
                const response = await fetch(url);
                const data = await response.json();
                allCases = data.cases;
                
                renderCases(allCases);
            } catch (error) {
                console.error('Error loading cases:', error);
                document.getElementById('casesTableBody').innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <div class="empty-state-icon">!</div>
                            <div>Error loading cases</div>
                        </td>
                    </tr>
                `;
            }
        }

        function renderCases(cases) {
            const tbody = document.getElementById('casesTableBody');
            
            if (cases.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <div class="empty-state-icon">-</div>
                            <div>No cases found</div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = cases.map(caseData => `
                <tr onclick="showDetail('${caseData.case_id}')">
                    <td><span class="case-id">${caseData.case_id}</span></td>
                    <td>${caseData.part_family}</td>
                    <td>${caseData.defect_type}</td>
                    <td><span class="status-badge status-${caseData.status}">${caseData.status}</span></td>
                    <td>${formatDate(caseData.created_at)}</td>
                    <td>${caseData.photo_count} photos</td>
                </tr>
            `).join('');
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        async function showDetail(caseId) {
            try {
                const response = await fetch(`/api/cases/${caseId}`);
                const caseData = await response.json();
                
                document.getElementById('detailCaseId').textContent = `Case ID: ${caseId}`;
                document.getElementById('detailBody').innerHTML = `
                    <div class="detail-grid">
                        <div class="detail-field">
                            <div class="detail-label">Part Family</div>
                            <div class="detail-value">${caseData.part_family}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-label">Alloy</div>
                            <div class="detail-value">${caseData.alloy}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-label">Defect Type</div>
                            <div class="detail-value">${caseData.damage_type}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-label">Status</div>
                            <div class="detail-value">
                                <span class="status-badge status-${caseData.status}">${caseData.status}</span>
                            </div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-label">Gap Estimate</div>
                            <div class="detail-value">${caseData.gap_estimate} mm</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-label">Length Estimate</div>
                            <div class="detail-value">${caseData.length_estimate} mm</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-label">Created At</div>
                            <div class="detail-value">${formatDate(caseData.timestamp)}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-label">Photos</div>
                            <div class="detail-value">${caseData.photo_paths.length} uploaded</div>
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <div class="detail-label">Photo Locations</div>
                        <div class="photo-grid">
                            ${caseData.photo_paths.map((path, idx) => {
                                const filename = path.split('/').pop();
                                const caseId = caseData.submission_id;
                                return `
                                    <img src="/uploads/${caseId}/${filename}" 
                                        alt="Photo ${idx + 1}" 
                                        style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px;">
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                
                document.getElementById('detailModal').classList.add('active');
            } catch (error) {
                console.error('Error loading case details:', error);
                alert('Failed to load case details');
            }
        }

        function closeDetail() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const status = btn.dataset.status;
                currentFilter = status;
                loadCases(status);
            });
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allCases.filter(c => 
                c.case_id.toLowerCase().includes(searchTerm) ||
                c.part_family.toLowerCase().includes(searchTerm) ||
                c.defect_type.toLowerCase().includes(searchTerm)
            );
            renderCases(filtered);
        });

        // Close modal on background click
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') {
                closeDetail();
            }
        });

        // Initial load
        loadStatistics();
        loadCases();

        // Refresh every 30 seconds
        setInterval(() => {
            loadStatistics();
            loadCases(currentFilter);
        }, 30000);
    </script>
</body>
</html>
